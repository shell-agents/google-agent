# shell-agents-spec: 0.1
[agent]
name = "google-agent"
version = "0.1.0"
license = "Apache-2.0"
description = "Gmail and Google Drive management agent powered by qwen3:14b"

[runtime]
sandbox = "recommended"

[[capabilities]]
id = "gmail.list"
blast = "none"
side_effects = []

[[capabilities]]
id = "gmail.read"
blast = "none"
side_effects = []

[[capabilities]]
id = "gmail.send"
blast = "high"
side_effects = ["network.egress", "email.send"]

[[capabilities]]
id = "drive.list"
blast = "none"
side_effects = []

[[capabilities]]
id = "drive.read"
blast = "none"
side_effects = []
